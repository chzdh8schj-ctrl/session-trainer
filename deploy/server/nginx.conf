# /etc/nginx/sites-available/session-trainer.conf
# Включить: ln -s /etc/nginx/sites-available/session-trainer.conf /etc/nginx/sites-enabled/
# Заменить CHANGE_ME_DOMAIN на домен или IP сервера.

server {
    listen 80;
    server_name CHANGE_ME_DOMAIN;

    # Импорт JSON бывает объёмным, но 2 МБ с запасом хватает.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Заголовки для websocket/upgrade — на случай, если понадобится позже.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Ответ ИИ на длинный вопрос может идти до минуты.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
